server:
  port: ${ORDER_SERVICE_PORT:8084}

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    table: flyway_order_schema_history

  application:
    name: order-service

  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://localhost:3307/flashticket_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kuala_Lumpur}
    username: ${ORDER_DB_USERNAME:root}
    password: ${ORDER_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

ticket-service:
  base-url: ${TICKET_SERVICE_BASE_URL:http://localhost:8082}

inventory-service:
  base-url: ${INVENTORY_SERVICE_BASE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

logging:
  level:
    root: WARN
    com.flashticket.orderservice: INFO
