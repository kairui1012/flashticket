services:

  redis:
    image: redis:latest
    container_name: flashticket-redis
    ports:
      - "6379:6379"
    networks:
      - flashticket-network

  mysql:
    image: mysql:8.0
    container_name: flashticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flashticket_auths
    ports:
      - "3307:3306"
    volumes:
      - flashticket-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - flashticket-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: flashticket-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - flashticket-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: flashticket-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - flashticket-network


volumes:
  flashticket-mysql-data:


networks:
  flashticket-network:
    driver: bridge
