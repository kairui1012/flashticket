server:
  port: 8081

spring:
  flyway:
    # Enables Flyway migrations when Auth Service starts.
    enabled: true

    # Loads versioned SQL migrations from src/main/resources/db/migration.
    locations: classpath:db/migration

    # Validates the versions and checksums of applied migrations before running pending ones.
    validate-on-migrate: true

    # Prevents Flyway clean from deleting all objects in this database schema.
    clean-disabled: true

    # Allows Flyway to adopt the current database when it already contains tables.
    baseline-on-migrate: true

    # Uses version 0 as the baseline so V1 still runs after an existing database is adopted.
    baseline-version: "0"

    # Keeps Auth migration records separate while multiple services share this database.
    table: flyway_auth_schema_history

  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3307/flashticket_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kuala_Lumpur
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml

  configuration:
    map-underscore-to-camel-case: true

jwt:
  # Defaults to the repository-level keys directory when started from the project root.
  # Production deployments should override these values with mounted secret file paths.
  private-key: ${JWT_PRIVATE_KEY:file:keys/private.pem}
  public-key: ${JWT_PUBLIC_KEY:file:keys/public.pem}
  
logging:
  level:
    com.flashticket.authservice.mapper: DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
