server:
  port: 8082

spring:
  flyway:
    # Enables Flyway migration when the application starts.
    enabled: true

    # Loads versioned migration scripts from src/main/resources/db/migration.
    locations: classpath:db/migration

    # Validates applied migration versions and checksums before running new migrations.
    validate-on-migrate: true

    # Prevents Flyway clean from deleting all objects in the configured schema.
    clean-disabled: true

    # Allows Flyway to adopt the existing non-empty database.
    baseline-on-migrate: true

    # Baselines the existing database at version 0 so the V1 migration still runs.
    baseline-version: "0"

    # Stores the Ticket Service migration history in its own database.
    table: flyway_ticket_schema_history

  application:
    name: tikcet-service

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: ${TICKET_DB_URL:jdbc:mysql://localhost:3307/flashticket_ticket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kuala_Lumpur}
    username: ${TICKET_DB_USERNAME:root}
    password: ${TICKET_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml

  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
